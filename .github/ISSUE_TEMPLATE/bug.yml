name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, Dhaara version, Docker version, provider/model. Never include API keys.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact command, expected behavior, actual behavior. Sanitize prompts, paths and output.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant sanitized output
      description: Prefer a small fixture. Session logs contain your source code; do not attach them unreviewed.

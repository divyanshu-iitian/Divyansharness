<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Divyansharness</title><desc id="desc">Think freely. Change deliberately. A terminal coding harness: stage, build, verify, apply. Zero runtime npm dependencies.</desc>
  <rect width="1200" height="420" rx="18" fill="#101b24"/>
  <g fill="none" stroke="#233846"><path d="M0 320H1200M820 0V420"/><path d="M50 0V420M0 50H1200" stroke-dasharray="3 9"/></g>
  <g fill="none" stroke="#89ddca" stroke-width="5" stroke-linecap="round">
    <path d="M922 104c0 40 146 40 146 80s-146 40-146 80"/>
    <path d="M943 104c0 40 146 40 146 80s-146 40-146 80" opacity=".6"/>
    <path d="M964 104c0 40 146 40 146 80s-146 40-146 80" opacity=".3"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="80" y="102" font-size="14" letter-spacing="3" fill="#89ddca">OPEN SOURCE / LOCAL SANDBOX / TERMINAL</text>
    <text x="74" y="212" font-size="62" font-weight="700" letter-spacing="-3" fill="#f5f7ed">divyansharness<tspan fill="#89ddca">_</tspan></text>
    <text x="80" y="268" font-size="23" fill="#bdcbd1">Talk. Plan. Build. Verify.</text>
    <text x="80" y="368" font-size="17" fill="#89ddca">01 stage</text>
    <text x="280" y="368" font-size="17" fill="#bdcbd1">02 build</text>
    <text x="480" y="368" font-size="17" fill="#bdcbd1">03 verify</text>
    <text x="680" y="368" font-size="17" fill="#bdcbd1">04 apply</text>
    <text x="865" y="368" font-size="14" fill="#89ddca">0 runtime npm dependencies</text>
  </g>
</svg>
